<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <button id="play">Play</button><button id="pause">Pause</button><button id="seek">Seek</button
    ><button id="ad">Ad</button>
    <script>
      let time = 0,
        playing = false,
        ad = false,
        at = performance.now();
      const send = (type, data = {}) =>
        parent.postMessage(JSON.stringify({ type: 'player:' + type, data }), '*');
      const advance = () => {
        if (playing && !ad) time += (performance.now() - at) / 1000;
        at = performance.now();
      };
      const command = (type, data = {}) => {
        advance();
        if (type === 'play') {
          playing = true;
          send('changeState', { state: 'playing' });
        }
        if (type === 'pause') {
          playing = false;
          send('changeState', { state: 'paused' });
        }
        if (type === 'setCurrentTime') {
          time = data.time;
          send('currentTime', { time });
        }
      };
      addEventListener('message', (event) => {
        let m;
        try {
          m = JSON.parse(event.data);
        } catch {
          return;
        }
        command(m.type.replace('player:', ''), m.data);
      });
      document.getElementById('play').onclick = () => command('play');
      document.getElementById('pause').onclick = () => command('pause');
      document.getElementById('seek').onclick = () => command('setCurrentTime', { time: 40 });
      document.getElementById('ad').onclick = () => {
        ad = !ad;
        send(ad ? 'adStart' : 'adEnd');
      };
      setInterval(() => {
        advance();
        send('currentTime', { time: ad ? 9000 : time });
      }, 300);
      window.snapshot = () => {
        advance();
        return { time, playing };
      };
      send('ready');
      send('durationChange', { duration: 300 });
    </script>
  </body>
</html>
